<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CRM demo – VNChat embed</title>
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #111827; background: #f3f4f6; display: grid; grid-template-columns: 1fr; min-height: 100vh; }
      @media (min-width: 900px) { body { grid-template-columns: 280px 1fr; } }
      aside { padding: 16px; background: #fff; border-right: 1px solid #e5e7eb; }
      section { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
      iframe { width: 100%; height: 640px; border: 1px solid #e5e7eb; border-radius: 12px; background: #fff; }
      button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; margin: 0 4px 4px 0; }
      #log { background: #111827; color: #d1fae5; padding: 12px; border-radius: 8px; min-height: 120px; font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
      #unread { font-weight: 600; }
    </style>
  </head>
  <body>
    <aside>
      <h1 style="font-size: 18px">CRM đối tác</h1>
      <p>Tin chưa đọc: <span id="unread" aria-live="polite">–</span></p>
      <p>
        <button type="button" data-msg='{"type":"theme:set","theme":"dark"}'>Theme tối</button>
        <button type="button" data-msg='{"type":"theme:set","theme":"light"}'>Theme sáng</button>
        <button type="button" data-msg='{"type":"locale:set","locale":"en"}'>English</button>
        <button type="button" data-msg='{"type":"navigate","route":"/embed/search"}'>Mở Tìm kiếm</button>
      </p>
      <div id="log" role="log"></div>
    </aside>
    <section>
      <!-- Đăng nhập diễn ra NGAY TRONG khung (Bearer); không truyền token qua URL hay postMessage. -->
      <iframe
        id="vnchat"
        title="VNChat"
        src="%VNCHAT_ORIGIN%/embed"
        allow="clipboard-write"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </section>
    <script>
      const ORIGIN = "%VNCHAT_ORIGIN%";
      const frame = document.getElementById("vnchat");
      const log = (line) => (document.getElementById("log").textContent += line + "\n");
      // Chỉ tin message đến từ đúng origin VNChat VÀ đúng iframe.
      window.addEventListener("message", (event) => {
        if (event.origin !== ORIGIN || event.source !== frame.contentWindow) return;
        const msg = event.data;
        if (!msg || msg.source !== "vnchat-embed" || msg.v !== 1) return;
        log(JSON.stringify(msg));
        if (msg.type === "unread:change") document.getElementById("unread").textContent = String(msg.count);
        if (msg.type === "navigate:external") window.open(msg.url, "_blank", "noopener");
      });
      document.querySelectorAll("button[data-msg]").forEach((b) => {
        b.onclick = () => frame.contentWindow.postMessage({ source: "vnchat-host", v: 1, ...JSON.parse(b.dataset.msg) }, ORIGIN);
      });
    </script>
  </body>
</html>
