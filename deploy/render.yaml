# Render Blueprint – VNChat web (static site). Sửa các origin đối tác cho đúng môi trường và giữ KHỚP với
# VITE_EMBED_PARENT_ORIGINS (biến build).
services:
  - type: web
    name: vnchat-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://vnchat-api.onrender.com
      - key: VITE_AUTH_TRANSPORT
        value: bearer
      - key: VITE_EMBED_PARENT_ORIGINS
        value: https://crm.partner.example,https://shop.partner.example
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Header khớp nhiều rule thì rule đặt sau thắng trên Render → rule riêng cho /embed, /widget đặt SAU rule chung.
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'self'
      - path: /embed*
        name: Content-Security-Policy
        value: frame-ancestors 'self' https://crm.partner.example https://shop.partner.example
      - path: /widget*
        name: Content-Security-Policy
        value: frame-ancestors 'self' https://crm.partner.example https://shop.partner.example
      - path: /vnchat-widget.js
        name: Cache-Control
        value: public, max-age=300
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
